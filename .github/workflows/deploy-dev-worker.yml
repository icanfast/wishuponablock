name: deploy-dev-worker

on:
  push:
    branches:
      - codex/0.3.0-dev
  workflow_dispatch:

concurrency:
  group: deploy-dev-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VITE_UPLOAD_MODE: local
      VITE_SHOW_DEV_TOOLS: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Validate required secrets
        run: |
          test -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)
      - run: npm ci
      - run: npm run build:dev030
      - name: Cloudflare whoami (direct)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euxo pipefail
          npx --yes wrangler@4 whoami
      - name: Deploy dev worker (direct)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euxo pipefail
          if ! npx --yes wrangler@4 deploy --env dev; then
            echo "Wrangler deploy failed, dumping latest wrangler log:"
            latest_log="$(ls -1t ~/.config/.wrangler/logs/wrangler-*.log | head -n1 || true)"
            if [ -n "${latest_log}" ] && [ -f "${latest_log}" ]; then
              echo "=== ${latest_log} ==="
              cat "${latest_log}"
            fi
            exit 1
          fi
